name = "chronoscapeatlas-admin-api"
main = "worker.js"
compatibility_date = "2026-10-06"
workers_dev = true

[vars]
ADMIN_USERNAME = "MediaTeam"
GITHUB_OWNER = "TamiasDrahcir"
GITHUB_REPO = "chronoscapeatlas"
SOURCE_BRANCH = "main"
PAGES_BRANCH = "gh-pages"
ALLOWED_ORIGINS = "https://tamiasdrahcir.github.io,http://localhost:5173"

# Wrangler creates this KV namespace on first deploy and stores the live archive in it.
[[kv_namespaces]]
binding = "ARCHIVE"

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
